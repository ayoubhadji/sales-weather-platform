name: Sales Weather Platform CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:

  # =========================
  # BACKEND
  # =========================
  backend:
    name: Backend - NestJS
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

  # =========================
  # FRONTEND
  # =========================
  frontend:
    name: Frontend - React/Vite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  # =========================
  # DOCKER BACKEND
  # =========================
  docker:
    name: Docker - Backend
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ayoubhadji/sales-weather-backend:latest \
            ./backend

      - name: Push Docker image
        run: |
          docker push ayoubhadji/sales-weather-backend:latest

  # =========================
  # AZURE DEPLOYMENT
  # =========================
  deploy:
    name: Deploy Backend to Azure
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deploy Docker image to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: sales-weather-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ayoubhadji/sales-weather-backend:latest